    for tornadoes (Figure 4). Specifically, there are no systematic significant differences
    in helicity in any quadrant for larger TCs in a radial coordinate normalized by
    outer size. Median values generally exceed those associated with TC tornadoes
    (i.e., ≥100 m2 s−2; McCaul & Weisman, 1996; McCaul et al., 2004) over the same
    subset of normalized radii for both downshear quadrants among outer size bins
    (i.e., ≤0.4r6 downshear left, ≤0.6r6 downshear right; McCaul, 1991). The downshear
    right quadrant shows slightly larger, yet nonsignificant, differences between
    helicity in large TCs and the remaining subsets. However, Figure S2 shows systematic
