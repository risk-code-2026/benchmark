- inputs:
  - In what ways does the ocean respond to tropical cyclones, and what physical processes
    are responsible for these responses?
  outputs:
  - 'Dominant processes in the oceanic response to TCs have mainly been discussed
    through case studies in both observations and models. These studies show that
    three main processes control SST fluctuations under TCs: oceanic vertical mixing,
    advection and air-sea heat exchange. The upper ocean cooling is primarily controlled
    by the entrainment of cold water from the thermocline into the mixed layer through
    vertical mixing, principally generated by the vertical shear of horizontal currents.
    This entrainment mixing accounts for about 80% of the SST drop in TCs wakes, but
    its contribution to the total cooling varies depending on the case study considered,
    from 70% in the case of TC Gilbert to more than 90% in the case of TC Frances
    or TC Gloria. Vertical mixing also seems to be responsible for the asymmetry of
    the cold anomaly with respect to the TC translation direction. Most intense inertial
    oscillations (and associated vertical shear) are indeed generated to the right
    (left) of the track in the Northern (Southern) Hemisphere, where TC winds rotate
    in the same direction as inertial currents, thus increasing the energy transfer
    to these currents.

    https://doi.org/10.1029/2011JC007396'
