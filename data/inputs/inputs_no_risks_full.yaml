- inputs:
  - What physical process is primarily responsible for the elongated low-energy tail
    of the relativistically broadened Fe Kα line observed in AGN?
  outputs:
  - 'Supermassive black holes (SMBHs) serve as primary drivers for the most powerful
    events occurring within the central regions of active galactic nuclei (AGN), which
    are visible throughout different energy ranges of the electromagnetic spectrum,
    notably X-rays (e.g., I. Shlosman et al. 1990). The X-ray power-law-like continuum
    seen in AGN is believed to originate from the corona (e.g., A. A. Galeev et al.
    1979; M. C. Begelman et al. 1983) or at the base of a jet above the inner accretion
    disk (e.g., R. D. Blandford & A. Königl 1979; A. H. Bridle & R. A. Perley 1984),
    where Comptonization occurs. A fraction of the X-rays generated in the corona
    irradiate the optically dense disk beneath, resulting in X-ray reflection and
    iron Kα emission visible above the power-law continuum at 6.4 keV due to the substantial
    abundance of iron (J. H. Krolik & T. R. Kallman 1987), which is composed of fluorescent
    and recombination emissions (e.g., I. M. George & A. C. Fabian 1991; A. C. Fabian
    et al. 2000). Furthermore, the typical Doppler effect, along with light bending
    and gravitational redshifting near the event horizon, causes a relativistic broadening
    of the fluorescent Fe Kα line originating from the innermost part of the accretion
    disk (C. S. Reynolds & M. A. Nowak 2003; J. M. Miller 2007). In particular, the
    gravitational redshift is mainly responsible for the elongated low-energy tail
    of the skew-symmetric-broadened Fe Kα line profile. Due to the proximity of the
    relativistic line-emitting region to the black hole, frame-dragging effects caused
    by a spinning black hole can have a significant impact on the emission profiles.
    Thus, the relativistically broadened X-ray Fe Kα line serves as a potent indicator
    of the spin of SMBHs in AGN (see reviews by L. Brenneman 2013; C. S. Reynolds
    2014, 2019)." Generate a science query from the following paragraph, in which
    the answer is found in that paragraph.

