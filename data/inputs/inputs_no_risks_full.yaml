- inputs:
  - How do atmospheric rivers contribute to extratropical weather extremes and the
    mid-latitude hydrological cycle?
  outputs:
  - 'Atmospheric rivers (ARs) are long, narrow corridors in the atmosphere characterized
    by strong horizontal water vapor transport (43, 44). They can contribute to extreme
    weather events, especially when both strong extratropical storms and large-scale
    moisture supply are present. ARs have large impacts on extratropical weather extremes
    (45–48), mid-latitudes poleward moisture and energy transport (43), polar moistening
    (49–51), and various aspects of the extratropical hydrological cycle (52–54).
    Mirroring the observed poleward shifts in storm tracks documented by previous
    studies (20, 22, 25–27, 55, 56), a similar and concurrent poleward shift in ARs
    has also been increasingly discussed (57–65). Many of these studies focus on regional
    variability, such as in the North Atlantic, North Pacific, and the Southern Ocean.
    These studies primarily attribute the regional poleward shifts to the aforementioned
    poleward movement of the westerly jet induced by global warming (57–59, 66), as
    well as other effects (63, 65). However, the poleward shifts in ARs still remain
    a topic of debate, with some studies indicating an equatorward shift in the North
    Atlantic (67) and North Pacific (66) and others suggesting an opposite tendency
    (57–65). Furthermore, while some studies have demonstrated a global shift in AR
    tracks (59, 62), the cause of these changes during the reanalysis era remains
    an open question. This knowledge gap makes it challenging to determine future
    changes of ARs and assess the reliability of climate models in replicating the
    similar feature.

    https://www.science.org/doi/10.1126/sciadv.adq0604'
