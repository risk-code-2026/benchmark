- inputs:
  - What observations support the idea of a unified model for AGN outflows connecting
    warm absorbers (WAs) and ultra-fast outflows (UFOs)?
  outputs:
  - 'X-ray observations of active galactic nuclei (AGNs) reveal blueshifted absorption
    features, which have been interpreted as outflows of photoionized gas along the
    line of sight (Halpern 1984). Soft X-ray absorption lines are commonly referred
    to as warm absorbers (WAs), while those ionized absorbers with a velocity higher
    than 10,000 km s−1 are defined as ultra-fast outflows (UFOs; Tombesi et al. 2010).
    WAs have been observed in over half of Seyfert 1 galaxies (e.g., Reynolds & Fabian
    1995; Reynolds 1997; George et al. 1998; Laha et al. 2014), which exhibit outflow
    velocities in the range of 100–500 km s−1 (e.g., Kaspi et al. 2000; Blustin et
    al. 2002; McKernan et al. 2007). On the other hand, X-ray observations of iron
    absorption lines can indicate outflow velocities that are quite large, up to mildly
    relativistic values of ∼0.1–0.4c (e.g., Pounds et al. 2003; Cappi 2006; Braito
    et al. 2007; Cappi et al. 2009). More recent studies show that UFOs are identified
    in a significant fraction (∼30%) of radio-quiet and radio-loud AGNs (Tombesi et
    al. 2010, 2011, 2012, 2014). Recently, Tombesi et al. (2013) concluded that UFOs
    and WAs are associated with different locations of a single large-scale stratified
    outflow in the AGN, suggesting a unified model for accretion powered sources (Kazanas
    et al. 2012). However, Laha et al. (2014, 2016) instead suggested that UFOs and
    WAs may be associated with two different outflows with distinctive physical conditions
    and outflow velocities.

