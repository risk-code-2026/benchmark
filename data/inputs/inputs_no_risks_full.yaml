- inputs:
  - Why is it difficult to study the X-ray properties of high-redshift Lyman continuum
    (LyC) emitters, and how can nearby analogs help?
  outputs:
  - 'X-ray observations of Lyman continuum (LyC) emitters in the early Universe face
    significant challenges due to their considerable distance. Our understanding of
    their X-ray characteristics is inferred from stacking analyses (Nandra et al.
    2002; Lehmer et al. 2005; Laird et al. 2006; Zinn et al. 2012; Basu-Zych et al.
    2013) and optimized averaging analysis (Cowie et al. 2012). The high redshifts
    of distant galaxies result in the rest-frame X-rays shifting into the energy range
    below a few keV. However, the extinction caused by the intergalactic medium, poor
    spatial resolutions, and low signal-to-noise ratios of distant galaxies preclude
    us from getting a complete picture of the X-ray properties of high-z LyC emitters,
    which could contribute to the majority of the early Universe’s ionizing budget
    (Barkana & Loeb 2001; Robertson et al. 2010; Dayal & Ferrara 2018). Because of
    this complication, it is difficult to study the X-ray features of high-z starburst
    galaxies. However, a detailed X-ray analysis of their nearby analogs helps us
    better understand the X-ray properties of LyC emitters in the faraway Universe.

