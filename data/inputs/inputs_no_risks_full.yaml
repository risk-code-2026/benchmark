- inputs:
  - Which symbiotic systems are known to emit hard X-rays, and why are these systems
    considered important for understanding the progenitors of type Ia supernovae?
  outputs:
  - 'Symbiotic systems are interacting binary stars consisting of a hot accreting
    compact object and a cool red giant companion (see e.g. Allen 1984; Kenyon 1986;
    Kenyon & Fernandez-Castro 1987; Muerset et al. 1991; Belczyński et al. 2000).
    Many of them demonstrate long- and shorter-term variability (Houk 1963; Mikolajewski,
    Mikolajewska & Khudiakova 1990; Sokoloski, Bildsten & Ho 2001; Sokoloski 2003;
    Hinkle, Fekel & Joyce 2009). Although symbiotic stars mostly display soft or supersoft
    X-ray emission (see e.g. Muerset, Wolff & Jordan 1997), a few of them show hard
    X-ray emission, namely RT Cru (Luna & Sokoloski 2007; Kennea et al. 2009; Eze
    2014; Ducci et al. 2016; Luna et al. 2018), CH Cyg (Kennea et al. 2009; Eze 2014),
    T CrB (Tueller et al. 2005; Luna, Sokoloski & Mukai 2008; Kennea et al. 2009;
    Eze 2014), CD–57 3057 (SS73 17) (Smith et al. 2008; Kennea et al. 2009; Eze, Luna
    & Smith 2010; Eze 2014), and MWC 560 (Stute & Sahai 2009). These hard X-ray emitting
    symbiotic systems pose a challenge to our understanding of accreting white dwarfs
    (WDs). We have not yet clearly understood the origin of hard X-ray emitting symbiotics.
    It was argued that hard X-ray emission could be an indication of massive WDs (Luna
    & Sokoloski 2007). Moreover, Kennea et al. (2009) proposed that these hard X-ray
    emitting symbiotics with massive WDs could be potentially progenitors of type
    Ia supernovae.

    https://doi.org/10.1093/mnras/staa3554'
