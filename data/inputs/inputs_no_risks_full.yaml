- inputs:
  - What observational phenomenon allows astronomers to detect supermassive black
    holes in nonactive galaxies, and how does it occur?
  outputs:
  - 'It is widely accepted that many galaxies host supermassive black holes (SMBHs)
    at their centers (see reviews by J. Kormendy & D. Richstone 1995; L. C. Ho 2008;
    J. Kormendy & L. C. Ho 2013; A. W. Graham 2016). The most compelling evidence
    for SMBHs currently stems from X-ray observations of active galactic nuclei (AGN),
    which exhibit luminous X-ray flares and iron Kα line emission. However, only a
    small portion of SMBHs are active, and the rest remain quiescent owing to weakly
    accreting or nonaccreting SMBHs as suggested by black hole evolution models (e.g.,
    J. Kormendy & K. Gebhardt 2001; A. Marconi et al. 2004). The direct detection
    of an SMBH in a nonactive galaxy is achievable by observing an X-ray brightening
    burst known as a tidal disruption event (TDE; see reviews by K. D. Alexander et
    al. 2020; R. Saxton et al. 2020; S. Gezari 2021). This phenomenon occurs when
    a star rips apart as it approaches too close to a massive black hole (J. G. Hills
    1975). Approximately half of the mass of the destroyed star falls into the black
    hole event horizon, resulting in bright X-ray and gamma-ray bursts (M. J. Rees
    1988). A portion of the accreted mass may also be transformed into an outflow
    (C. R. Evans & C. S. Kochanek 1989), potentially producing a relativistic jet
    called a tidal disruption flare, as seen in late-time radio observations (e.g.,
    B. A. Zauderer et al. 2011; S. B. Cenko et al. 2012; G. C. Brown et al. 2017;
    S. Mattila et al. 2018).

