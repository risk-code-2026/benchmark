- inputs:
  - What evidence suggests that RT Cru may have a heavily obscured soft thermal X-ray
    emission component around 1 keV, and why is it difficult to detect?
  outputs:
  - 'Although the previous X-ray data of RT Cru revealed only highly absorbed, hard
    thermal plasma emission of 8.6 keV (Luna & Sokoloski 2007), a recent Bayesian
    statistical analysis of the latest Chandra observations also suggested the possible
    existence of heavily obscured, soft plasma emission with a temperature of ∼1.3
    keV in addition to a hard thermal component with a temperature of 9.6 keV (Danehkar
    et al. 2021). However, a recent statistical method based on differences between
    the backgrounds from the smooth and likelihood-ratio tests could not robustly
    put constraints on low-energy emission lines of the soft thermal emission, but
    yielded an upper confidence limit of 1 keV on the soft plasma temperature (Zhang
    et al. 2023). A dramatic decline in optical emission lines and hard X-ray emission
    in RT Cru observed to have occurred in 2019 was attributed to a strong decline
    in accretion activity (Pujol et al. 2023). Nevertheless, high X-ray variability
    of RT Cru indicates that some dense materials along the line of sight could potentially
    block a large portion of the thermal emission (Danehkar et al. 2021). Accordingly,
    the soft thermal emission component (∼1 keV) might be heavily obscured by such
    material, making it difficult to detect with significant statistics.

