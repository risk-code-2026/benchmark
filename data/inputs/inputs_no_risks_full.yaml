- inputs:
  - Why do the generalized interacting stellar wind (GISW) models struggle to fully
    explain the morphologies observed in planetary nebulae?
  outputs:
  - 'Observations of PNs have mostly displayed elliptical and bipolar axisymmetric
    morphologies (see, e.g., Balick 1987; Balick et al. 1987; Schwarz et al. 1992;
    Sahai et al. 2011; Weidmann et al. 2016), which pose a major challenge to theories
    describing their formation (see the review by Balick & Frank 2002). Although single
    stars are expected to produce spherical nebula shells, the interaction with the
    interstellar medium (ISM) may also result in elliptical shells. However, the theories
    face considerable difficulties in generating highly axisymmetric morphologies
    similar to what are seen in observations. According to the interacting stellar
    wind (ISW) theory (Kwok et al. 1978), a compressed, dense shell is formed when
    a slow (∼10 km s−1), dense wind from the AGB phase is pushed away by a fast (∼1000
    km s−1), tenuous stellar wind from the PN phase. The ISW model extended by Kahn
    & West (1985), known as the generalized interacting stellar wind (GISW) theory,
    can also produce a highly axisymmetric gas distribution. Nevertheless, the GISW
    model is unable to fully describe all observed elliptical and bipolar morphologies
    (Balick & Frank 2002). Moreover, the GISW model needs a density contrast to produce
    an aspherical morphology. Recently, many complex axisymmetric morphologies have
    been found by high-resolution imaging observations (see, e.g., Sahai et al. 2011),
    which cannot adequately be described by the GISW theory.

    https://doi.org/10.3847/1538-4365/ac5cca'
