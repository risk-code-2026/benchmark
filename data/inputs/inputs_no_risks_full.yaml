- inputs:
  - What external and internal factors affect the upscale growth convection into MCSs?
  outputs:
  - 'Along with the environmental factors that may favor UCG, internal storm processes
    also inherently play a role in this process. Downdrafts, owing to both hydrometeor
    loading and diabatic microphysical cooling, result in the formation of cold pools
    beneath convective drafts. Under certain conditions, these cold pools may spread
    laterally and interact with neighboring cold pools, encouraging secondary CI and
    promoting UCG. Additionally, depicted that developing MCSs can generate convectively
    induced gravity waves that condition the surrounding environment by bolstering
    CAPE and reducing convective inhibition (CIN), allowing CI to occur more readily.
    Recent idealized numerical model simulations presented showed that upscale-growing
    MCSs can self-organize through both surface-based cold pools and internal (elevated)
    bore processes, regardless of external influences, such as fronts or LLJs.


    Low-level lifting associated with the interaction between ambient low-level vertical
    wind shear and convective cold pools has been invoked as one idea for long-lived
    squall lines, although other authors have stressed the importance of upper-level
    vertical wind shear on squall-line intensity. The leading edge of cold pools (hereafter
    “gust fronts” or “outflow boundaries”) typically display increases of nonhydrostatic
    pressure and resultant upward-directed perturbation pressure gradient forces,
    inducing ascent and the potential for secondary CI. Furthermore, increases in
    low-level vertical wind shear can favor wider updrafts which may process more
    water vapor and result in stronger/wider downdrafts and colder cold pools. Recent
    idealized supercell simulations showed that increases in vertical wind shear over
    the lowest 2 km resulted in stronger/wider updrafts and downdrafts, more precipitation
    production and stronger/wider cold pools. Found similar supercell characteristics
    for increases in upper-level vertical wind shear (6–12 km). These stronger/wider
    cold pools in environments with increased vertical wind shear, which may initially
    favor supercells as the primary convective mode, may later favor a more rapid
    upscale transition into MCSs via cold pool amalgamation and/or surging outflows.

    https://journals.ametsoc.org/view/journals/mwre/147/12/mwr-d-19-0099.1.pdf'
