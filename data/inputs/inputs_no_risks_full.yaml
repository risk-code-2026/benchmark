- inputs:
  - What are the asymmetries between the leading and following magnetic polarities
    of solar active regions ?
  outputs:
  - 'Besides their highly organized behavior during each solar cycle, active regions
    are found to possess some interesting asymmetries between their leading and following
    polarities. Observations show that the axis connecting the leading and the following
    polarities of each active region is nearlyeast-west oriented (or toroidal) but
    on average shows a small tilt relative to the east-west direction with the leading
    polarity of the region being slightly closer to the equator than the following(see
    Figure1). This small mean tilt angle is found to increase approximately linearly
    with the latitude of the active region (Wang and Sheeley Jr,1989,1991;Howard,1991a,b;Fisheret
    al.,1995). This observation of active region tilts is originally summarized inHaleet
    al.(1919) and is generally referred to as Joy’s law. Note that Joy’s law describes
    the statistical mean behavior of the active region tilts. The tilt angles of individual
    active regions also show a large scatter about the mean (Wang and Sheeley Jr,1989,1991;Howard,1991a,b;Fisheret
    al.,1995). Another intriguing asymmetry is found in the morphology of the leading
    and the following polarities of an active region.The flux of the leading polarity
    tends to be concentrated in large well-formed sunspots, whereas the flux of the
    following polarity tends to be more dispersed and to have a fragmented appearance
    (seeBray and Loughhead,1979). Observations also show that the magnetic inversion
    lines (the neutral lines separating the fluxes of the two opposite polarities)
    in bipolar active regions are statistically nearer to the main following polarity
    spot than to the main leading spot (van Driel-Gesztelyi andPetrovay,1990;Petrovayet
    al.,1990). Furthermore for young growing active regions, there is anasymmetry
    in the east-west proper motions of the two polarities, with the leading polarity
    spotsmoving prograde more rapidly than the retrograde motion of the following
    polarity spots (seeChouand Wang,1987;van Driel-Gesztelyi and Petrovay,1990;Petrovayet
    al.,1990).  Reference(Page-6: https://link.springer.com/article/10.12942/lrsp-2004-1'
  risk_ids: []
  SME: Dinesh
- inputs:
  - How do CME kinematics and magnetic orientation—tracked from the corona into interplanetary
    space via coronagraph, radio, and in-situ observations govern the likelihood and
    intensity of geomagnetic storms, relative to SIR/CIR drivers, and what does solar
    cycle 24 (including the 26 Aug 2018 event) reveal about this relationship?
  outputs:
  - 'It is well established that intense geomagnetic storms with a Dst index <−150
    nT are almost always associated with coronal mass ejections (CMEs), while weaker
    storms with Dst >−150 nT can be caused by CMEs and stream interaction regions.
    CMEs causing geomagnetic storms are generally fast and wide indicating they are
    very energetic (see e.g., Gopalswamy, 2018 and references therein). Occasionally,
    storms are caused by slower CMEs as observed in the coronagraph field of view
    (FOV) (Zhang et al., 2007). Many of these CMEs continue to accelerate beyond the
    coronagraph FOV and attain sufficient speed to drive shocks at large distances
    from the Sun that can be detected in situ or via purely kilometric type II radio
    bursts (Gopalswamy, 2006; Gopalswamy et al., 2010). During the weak solar cycle
    24, the frequency and intensity of geomagnetic storms is unusually low (Gopalswamy,
    2012; Kakad et al., 2019; Richardson, 2013). Toward the end of this cycle, an
    intense storm has been observed on 26 August 2018 with a Dst index of −175 nT.
    Only two storms in solar cycle 24 are stronger than this event: The 17 March 2015
    (−222 nT) and 23 June 2015 (−204 nT) storms (see e.g., Gopalswamy, Akiyama, et
    al., 2015; Liu et al., 2015; Webb & Nitta, 2017; Wu et al., 2016). The 26 August
    2018 event is characterized by a weak solar eruption, significant flux rope rotation
    in the corona and interplanetary (IP) medium, and an intense geomagnetic storm,
    as first reported by Chen et al. (2019). These authors identify the solar source
    of this storm as a filament channel eruption and track the CME propagation in
    the corona and IP medium. The event has also been reported to have widespread
    space weather effects at Earth (Abunin et al., 2020; Zakharenkova et al., 2021)
    and Mars (Thampi et al., 2021). Although some authors claim that this is a stealth
    CME (Mishra & Srivastava, 2019; Nitta et al., 2021; Piersanti et al., 2020), the
    near-surface signatures are clear,  although weak (Abunin et al., 2020; Chen et
    al., 2019). Reference(Introduction:https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2022JA030404'
  risk_ids: []
  SME: Dinesh
- inputs:
  - Which coronal magnetic-field models are most commonly used, how do their assumptions
    and outer-boundary conditions differ, and how does outer-boundary sensitivity
    affect their ability to reproduce observed coronal structures?
  outputs:
  - 'The three most common models of the magnetic field in the solar atmosphere are
    the

    potential field source surface (PFSS; Altschuler and Newkirk, 1969) model, the
    linear force free magnetic field (LFF; Nakagawa, 1973; Levine and Altschuler,
    1974), the nonlinear force free magnetic field (NLFF; Wiegelmann, 2007) model,
    which are summarized nicely in Mackay and Yeates (2012). Another approach that
    avoids many ofthe flawed assumptions in the first three techniques is the non
    force-free field (NFFF; Hu and Dasgupta, 2006) model. By themselves, all of these
    models suffer from a lack of sufficient constraints: while the photospheric magnetic
    field is well observed, and can be used as a boundary condition to calculate the
    solution to each model, global models still require an outer boundary condition
    to fully constrain the problem numerically. In PFSS models, the outer boundary
    condition is assumed to be a perfectly radial magnetic field at a location called
    the “source surface.” Although there are good theoretical reasons to assume the
    existence of such a surface, early eclipse observations (Schatten, 1971) and MHD
    (Pneuman and Kopp, 1971) models indicated that polar plumes tended to bend more
    equator-ward than was predicted by the PFSS model, while the bending of streamers
    should, contrary to the results of the PFSS extrapolation, depend on the amplitude
    of the solar cycle (Mackay and Yeates, 2012). Furthermore, Ulysses observations
    initially supported the view that the magnetic field was essentially uniform in
    latitude (Wang and Sheeley, 1990). These considerations prompted the development
    of the Schatten et al. (1969) model, which we will call the SCS, in which the
    magnetic field outside the source surface produced by the PFSS was replaced with
    a similar current free magnetic field into which currents are introduced, essentially,
    by hand. A subsequent addition to this model attempted to minimize the magnitude
    of extraneous currents introduced by this process (Schatten, 1971). Reference(Introduction):https://www.frontiersin.org/articles/10.3389/fspas.2024.1476498/full'
  risk_ids: []
  SME: Dinesh
- inputs:
  - How do empirical, drag-based, physics-based, and global MHD ICME propagation models
    differ in their assumptions and treatment of ICME magnetic structure; what forecast
    accuracy do they achieve for Earth-arrival times; and what limits their ability
    to predict magnetic fields in the sheath and cloud at Earth, and how are these
    limitations being addressed?
  outputs:
  - 'A number of ICME propagation models have been developed over the years to reproduce
    their travel through interplanetary space and forecast arrival times at Earth.
    Such models include empirical models (e.g., Vandas et al. 1996;Brueckneretal.
    1998; Gopalswamy et al. 2001, 2005;Wangetal. 2002), drag-based models (DBMs; Vršnak
    & Gopalswamy 2002), and physics-based models, such as the shock time of arrival
    (STOA; Dryer & Smart 1984), STOA-2 (Moon et al. 2002), and HAFv.2 (Fry et al.
    2001). Newer-generation prediction models such as the Wang- Sheeley-Arge (WSA)-ENLIL-Cone
    model (Odstrcil et al. 2004) use magnetohydrodynamic (MHD) simulations in which
    ICMEs are inserted into the ambient flow as nonmagnetized overpressured plasma
    blobs. The accuracy of these types of models is not much higher than in the previously
    mentioned models of lesser complexity and have a mean absolute error of more than
    10 hr (Amerstorfer et al. 2018; Riley et al. 2018). Gopalswamy et al. (2013) have
    shown that the performance of the WSA-ENLIL-Cone model is similar to that of the
    empirical shock arrival model (Gopalswamy et al. 2005). The WSA-ENLIL-Cone and
    HAFv.2 models can calculate magnetic fieldinthe ICME sheath region because a preceding
    shock distorts the interplanetary magnetic field. However, they are unable to
    describe magnetic field in ICME clouds at Earth because of the absence of an explicitly
    defined magnetic field inside them (Fry et al. 2001; Odstrcil et al. 2004). Attempts
    have been made to remedy this by adding a simple magnetic field into the plasma
    blobs (see, e.g., Shen et al. 2011). Reference(Introduction): https://doi.org/10.3847/1538-4357/ac73f3'
