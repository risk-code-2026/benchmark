- inputs:
  - Why are abundances derived from optical recombination lines (ORLs) considered
    potentially more reliable than those derived from collisionally excited lines
    (CELs) in planetary nebulae?
  outputs:
  - 'Historically, the strong and easy-to-measure collisionally excited lines (CELs)
    have provided reliable chemical tracers, and they have been extensively used to
    derive the abundances of heavy elements such as N, O, Ne, Ar, and S relative to
    H (see, e.g., Kingsburgh & Barlow 1994; Kwitter & Henry 2001; Tsamis et al. 2003a;
    Henry et al. 2004; Liu et al. 2004). CEL emissivities depend exponentially on
    the electron temperature, so temperature variations introduce uncertainties into
    their results (e.g., Garnett 1992; Stasińska 2005). On the other hand, optical
    recombination lines (ORLs) have a much weaker dependence on the electron temperature
    and density, thus in principle resulting in more reliable abundance analyses.
    ORLs from heavy-element ions are extremely weak relative to Hβ, but are observable
    in deep spectra of nearby PNs. Numerous studies indicate that the abundances derived
    from ORLs are systematically higher than those obtained from CELs in PNs (Liu
    et al. 2000, 2001; Luo et al. 2001; Wesson et al. 2003, 2005; Tsamis et al. 2004,
    2008; Wesson & Liu 2004; García-Rojas et al. 2009). The causes of CEL/ORL abundance
    discrepancies are not fully understood and remain an open problem in nebular astrophysics.
    This abundance discrepancy problem was already found in gaseous nebulae about
    80 years ago (Wyse 1942; Aller & Menzel 1945).

