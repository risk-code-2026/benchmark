- inputs:
  - What is the relationship between recent experiences of extreme weather and public
    perceptions of climate-related risks in the UK?
  outputs:
  - 'Research among the general population has provided a number of insights into
    how the UK public perceive climate change. For example, there appears to be widespread
    recognition that weather patterns are changing, and a common tendency for conflation
    both between climate change and other environmental issues (Taylor et al., 2014)
    and between the concepts of mitigation and adaptation (Harcourt et al., 2019).
    Research has also established a relationship between recent experiences of extreme
    weather and people’s perception of climate-related risks, highlighting the influence
    of what is known as the availability heuristic (Taylor et al., 2019) or availability
    bias (Shepherd et al., 2018) wherein the level of risk is judged by the ease with
    which relevant changes in weather and extreme events come to mind. Witnessing
    the effects of extreme weather, such as flooding, is thus thought to increase
    awareness and concern about future impacts of climate change. The extent to which
    these findings apply to the farming population, however, is unclear and cannot
    be assumed given the social and cultural specificities of this group (Gasson and
    Errington, 1993, Burton, 2004) and evidence that risk perception is specific to
    culture and place (Taylor et al., 2014). Farmers have always had a particularly
    close and experiential relationship with the weather (Osborne and Evans, 2019)
    and, given the reliance of their livelihoods on weather and climate, they might
    be expected to be particularly aware of, and responsive to, changing conditions.
    The nature of their occupation may also make them more – or at least differently
    - sensitive to climatic changes compared to the wider population. Indeed, the
    limited evidence available suggests this is likely to be the case. For instance,
    whilst research with the general public has repeatedly shown greater concern around
    increasing rainfall/flooding than heatwaves/drought (Taylor et al., 2019, Harcourt
    et al., 2019), reduced summer rainfall/drought raises particular concern for farmers
    due to the significant risk it poses to crop yields (Tate et al., 2010)

    https://www.sciencedirect.com/science/article/pii/S2212096321000425'
