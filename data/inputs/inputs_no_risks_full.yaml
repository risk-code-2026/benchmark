- inputs:
  - Which fluid model is usually used to model and simulate the stellar feedback from
    young massive stars and supernovae?
  outputs:
  - 'The mechanical feedback from stellar winds and SNe has been modeled using adiabatic
    fluid flow by a number of authors (Castor et al. 1975; Weaver et al. 1977; Chevalier
    & Clegg 1985; Cantó et al. 2000). The adiabatic solutions by Castor et al. (1975)
    and Weaver et al. (1977) were derived by taking an expanding shell surrounded
    by the H i and H ii regions of a uniform density that leads to the formation of
    a bubble. Similarly, the adiabatic steady wind solution by Chevalier & Clegg (1985)
    was obtained by adopting a continuous freely expanding stationary wind without
    any ambient medium. The analytical solution of Chevalier & Clegg (1985, hereafter
    CC85) describes strong superwinds driven by the kinetic and thermal energies supplied
    by SNe and massive stars of a stellar cluster. The CC85 model provided the first
    approximate analytic solution to the adiabatic hydrodynamic properties of the
    freely streaming stationary superwinds, indicating that density, temperature,
    and thermal pressure of the superwind around the SSC decrease with radius r as
    ρw ∝ r−2, Tw ∝ r−4/3, and Pw ∝ r−10/3, respectively, while the wind velocity uw
    approaches the adiabatic terminal speed VA,∞. The numerical simulations of the
    CC85 model conducted by Cantó et al. (2000) demonstrated that both the analytic
    adiabatic solutions and their numerical calculations are fully consistent for
    spherically symmetric homogeneous winds.

    https://doi.org/10.3847/1538-4357/ac1a76'
