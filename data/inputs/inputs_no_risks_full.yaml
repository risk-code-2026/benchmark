  SME: Dinesh
- inputs:
  - What are the major categories of shocks observed in the heliosphere, and how do
    they arise across interplanetary, planetary-bow, cometary, and heliospheric-boundary
    contexts?
  outputs:
  - Shocks that are routinely observed in the heliosphere can be divided in several
    categories, namely interplanetary (IP) shocks, generated as a consequence of solar
    activity phenomena, such as Coronal Mass Ejections (CME) and Stream Interaction
    Regions (SIR) (Dessler and Fejer, 1963; Gosling et al., 1974), and planetary bow
    shocks, resulting from the interaction between the supersonic solar wind and planetary
    bodies behaving as obstacles for the solar wind flow (e.g., Dungey, 1979; Hoppe
    and Russell, 1982; Lepping, 1984). Other examples of shocks observed in-situ include
    the Voyager observations of the heliospheric termination shock at the interface
    between the heliosphere and the interstellar environment (e.g., McComas et al.,
    2019) and cometary bow shocks (Thomsen et al., 1986; Coates et al., 1997; Naeem
    et al., 2020). Despite the important differences between these different types
    of shocks, they share their fundamental, underlying physics. Reference(Introduction):https://www.frontiersin.org/articles/10.3389/fspas.2022.1005672/full
