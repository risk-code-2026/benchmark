- inputs:
  - How does ice–ice collisional noninductive charging in thunderstorms vary with
    environmental conditions, and what conditions lead to normal versus anomalous
    charging regimes in the mixed-phase region?
  outputs:
  - 'Although there are several probable processes through which thunderstorm electrification
    occurs, the primary method is thought to be ice–ice collisional noninductive charging
    (NIC). NIC theory describes the transfer of charge during rebounding collisions
    between precipitation and cloud ice particles growing in the presence of supercooled
    liquid cloud water. Results from laboratory studies indicate that the polarity
    of charge associated with each hydrometeor type is determined by cloud microphysical
    conditions including liquid water content (LWC), temperature, and supersaturation.
    Typical conditions within the mixed-phase region of a thunderstorm provide for
    the normal charging regime associated with cooler temperatures and lower LWC in
    which precipitation ice becomes negatively charged. By contrast, the anomalous
    charging regime is characterized as positive charging of precipitation ice and
    negative charging of cloud ice at warmer temperatures, in the presence of higher
    cloud LWC, and possibly at lower environmental supersaturation. Vertical variations
    in the aforementioned thermodynamic and cloud microphysical properties along with
    gravitational sedimentation of oppositely charged cloud and precipitation ice
    hydrometeors result in the simplified dipole and tripole conceptual models of
    charge structure. In reality, charging behaviors and resulting net charge structures
    are more complex. For instance, within varying kinematic and cloud microphysical
    conditions in a three-dimensional updraft, multiple charging regimes may be present
    even as net charge regions reflect the dominant behavior. Additionally, other
    noninductive and inductive charging mechanisms may affect charging behavior while
    three-dimensional flows at storm to turbulent scales, differential sedimentation,
    and charge deposition by lightning flashes contribute to observed intricacy and
    diversity of charge structures.

    https://doi.org/10.1175/MWR-D-21-0071.1'
