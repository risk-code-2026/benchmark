- inputs:
  - To what extent can environmental wind profiles predict tornadogenesis outcomes
    compared to cold pool buoyancy?
  outputs:
  - 'A key, emerging theme from these and other recent simulations (e.g., Parker and
    Dahl 2015, CP17) is that it ostensibly does not matter how a supercell generates
    near-ground rotation (whether via barotropic, baroclinic, or frictional processes).
    Rather, it is more practically pertinent to ascertain whether (and how) the ample
    near-surface rotation present in all surface-based supercells is converged and
    stretched by the low-level updraft into a tornadic-strength vortex (i.e., the
    third and final step of the tornadogenesis process; Davies-Jones 2015). Fortunately,
    for operational forecasting purposes, the eventual fate of subtornadic surface
    vertical vorticity is not determined solely by the cold pool buoyancy, but rather
    that tornadogenesis seems to be substantially modulated by the environmental wind
    profile (at least for the VORTEX2 composite environments), even as chaotic within-storm
    details still permit a range of possible outcomes (as in the nontornadic VORTEX2
    ensemble). This is encouraging operationally because lower-tropospheric SRH can
    be diagnosed more easily than outflow buoyancy.

    https://journals.ametsoc.org/view/journals/mwre/145/11/mwr-d-17-0152.1.xml'
