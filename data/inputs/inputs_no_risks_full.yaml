- inputs:
  - What observational evidence implying that adiabatic models may not properly explain
    observations of sutperwinds in star-forming galaxies?
  outputs:
  - 'Observations of star-forming galaxies reveal the presence of galactic outflows,
    known as superwinds (Heckman et al. 1990), with multiphase structures having regions
    with low temperatures (101−3 K) based on submillimeter and infrared observations
    (Ott et al. 2005; Weiß et al. 2005; Bolatto et al. 2013; Leroy et al. 2015), warm
    ( ≈ 104−4.5 K) wind regions as seen in optical and near-UV measurements (Walsh
    & Roy 1989; Izotov & Thuan 1999; James et al. 2009, 2013), as well as hot (106.5−8
    K) bubbles in X-ray observations (della Ceca et al. 1996; Strickland et al. 1997;
    Martin 1999; Ott et al. 2005). Historically, starburst-driven superwinds have
    been modeled using adiabatic assumptions (Castor et al. 1975; Weaver et al. 1977;
    Chevalier & Clegg 1985; Cantó et al. 2000). However, adiabatic models are not
    consistent with suppressed superwinds observed in several starburst galaxies such
    as M82 (Smith et al. 2006; Westmoquette et al. 2014), NGC 5253 (Turner et al.
    2017), NGC 2366 (Oey et al. 2017), and extreme Green Peas (GPs; Jaskot et al.
    2017). In particular, cooling superwinds can produce virial temperatures below
    104 K, and can stimulate star formation (Fabian et al. 1984; Sarazin 1988; Krause
    et al. 2016; Silich & Tenorio-Tagle 2017) and extensive molecular gas (e.g., Veilleux
    et al. 2020).

    https://doi.org/10.3847/1538-4357/ac8cec'
