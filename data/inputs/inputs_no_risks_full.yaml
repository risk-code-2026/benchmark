- inputs:
  - How does shortwave radiation affect the intensity evolution and reintensification
    of tropical cyclones during eyewall replacement cycles in numerical experiments?
  outputs:
  - 'First we will explore the impacts shortwave radiation had on the intensity evolution
    during the ERCs of each experiment. Figure 2 shows the evolution of the 10-m maximum
    winds for each experiment listed in Table 1 with the black line indicating the
    Control. Here we define the ERC as beginning with the SEF at an altitude of 3
    km and completing with the start of reintensification of the 10-m winds, which
    is denoted for each experiment in Figure 2 to orient the reader. To first order,
    there is little change to the TC intensity evolution in the 48 h restarts over
    the initial 48 h. The result suggests that the rapid intensification processes
    ongoing in the eyewall of the simulation are not affected by different shortwave
    heating magnitudes despite changes to the outer core thermodynamics at this time.
    Between the experiments, a consistent relationship between shortwave heating and
    TC intensity does not manifest until the TCs begin to weaken slightly at the 120
    h mark. Interestingly, the simulations which had more shortwave heating tend to
    be stronger than simulations without any shortwave heating. There are two possible
    explanations for this difference. The first explanation is that the shortwave
    heating in the canopy strengthened the upper-level secondary circulation that
    through mass conservation enhances the low-level inflow convergence of angular
    momentum. Although a stronger secondary circulation at upper-levels is evident
    in our simulations, consistent with recent literature and will be shown in Section
    4, these anomalies remain primarily at the upper-levels and do not manifest themselves
    in stronger low-level radial winds (Navarro et al., 2017; Ruppert & O''Neill,
    2019). Another explanation is that the larger amounts of shortwave radiative heating
    within the eye of the TCs can enhance the warm core. A stronger warm core is generally
    considered an indicator of a stronger TC with lower central pressure through hydrostatic
    balance (Ohno et al., 2016).

    https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2020JD034016'
