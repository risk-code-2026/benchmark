- inputs:
  - What salt types can be delivered by atmospheric mechanisms in hyperarid region
    on Earth and Mars?
  outputs:
  - The atmospheric origin of salt crusts on soil surfaces is also increasingly recognized
    as important in hyperarid regions on Earth. The gas phase oxidation of chlorine-compounds
    to perchlorate can explain observations in both the Atacama Desert and on Mars
    (Catling et al., 2010) with yields being assisted by silica and metal oxides acting
    as photocatalysts (Carrier & Kounaves, 2015). Nitrate and sulfate salts can also
    be delivered by atmospheric mechanisms in hyperarid regions on Earth (Ericksen,
    1981), a hypothesis at least partly supported by isotopic measurements of Atacama
    nitrate (Michalski et al., 2003) and sulfate (Bao et al., 2004). Similar processes
    may have operated on Mars. Nitrate, perchlorate, and iodate have been shown to
    cooccur in terrestrial deserts (Lybrand et al., 2016), and nitrates have been
    detected in regolith on Mars in concentrations up to hundreds of ppm (Stern et
    al., 2015). Salt crusts are also present in Antarctica, where they can serve as
    habitats for microorganisms (Hughes & Lawley, 2003; Marchant & Head, 2007). Because
    the top most layer of the Martian soil is in contact with the Martian atmosphere,
    if atmospheric humidity is sufficiently high, hygroscopic salts such as perchlorates,
    sulfates, and chlorides can absorb moisture from the air, changing the hydration
    state and deliquescing and forming brines that have been shown to form crusts
    in Mars analog regolith in laboratory experiments (Ramachandran et al., 2021).                                                                        https://doi.org/10.1029/2022JE007433
