- inputs:
  - How do vortical hot towers (VHTs) contribute to the upscale growth and surface
    spinup of tropical cyclones prior to the WISHE amplification phase?
  outputs:
  - 'Given the fact that the simulated VHTs are three-dimensional structures possessing
    height-to-width aspect ratios of order unity and maximum updraft velocities that
    exceed maximum horizontal swirl velocities, what, then, is the nature of the upscale
    growth and surface spinup on the system scale? Prior to the WISHE amplification
    phase, the initial MCV provides a convectively unstable and cyclonic vorticity-rich
    environment for the intense cyclonic vertical vorticity (η > 3 × 10−3 s−1) cores
    that arise via tilting and stretching of preexisting vorticity by the hot tower
    updrafts. The MCV and vortical cores create a locally protected environment (McWilliams
    1984; Julien et al. 1999; Reasor et al. 2004) supporting a more efficient conversion
    of latent heat energy into rotational (kinetic) energy of the horizontal winds
    (Schubert and Hack 1982; Hack and Schubert 1986). While individually possessing
    relatively short lifetimes (on the order of 1 h), the aggregate of VHTs (an active
    population consisting of growing, quasi-steady, merging, and dying towers) mimic
    a quasi-steady heating rate on the system-scale circulation. For the system scale
    to remain in thermal wind balance, a thermodynamically direct toroidal circulation
    is generated with inflow near the surface (0 < z < 2 km) and mid- to upper levels
    (6 < z < 9 km), and outflow in the upper troposphere (9 < z < 14 km). This quasi-balanced
    toroidal circulation converges near-surface and mid- to upper-level cyclonic vorticity
    of the initial MCV and convective-scale cyclonic vorticity anomalies generated
    by VHT events.

    https://journals.ametsoc.org/view/journals/atsc/63/1/jas3604.1.xml?tab_body=fulltext-display'
