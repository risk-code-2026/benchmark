    a habitable environment requires liquid water, nutrients, an energy source, and
    protection from detrimental influences such as a cold, highly oxidizing conditions,
    and high flux of ionizing radiation (Conrad, 2014). Based on that assumption,
    the hydrothermal system formed during interaction of the magma (heat source) and
    groundwater would have been a habitable environment once the system cooled below
    ∼120 °C (Rothschild and Mancinelli, 2001; Mancinelli et al., 2004; DasSarma, 2006).
