  outputs:
  - Thunderstorm electrification is primarily explained by the ice–ice collisional
    noninductive charging (NIC) theory, which has long been established as the main
    mechanism. According to NIC, charge is transferred during collisions between precipitation
    and cloud ice particles in the presence of supercooled liquid water, and laboratory
    studies have consistently shown that the polarity of charge for each hydrometeor
    type is determined by factors such as liquid water content (LWC), temperature,
    and supersaturation. The normal charging regime, associated with cooler temperatures
    and lower LWC, results in precipitation ice becoming negatively charged, while
    the anomalous regime, found at warmer temperatures and higher LWC, leads to positive
    charging of precipitation ice. These processes, along with gravitational sedimentation,
    explain the classic dipole and tripole models of thunderstorm charge structure.
    The NIC mechanism, as described in foundational studies, remains the definitive
    explanation for the electrification and charge distribution observed in thunderstorms.
