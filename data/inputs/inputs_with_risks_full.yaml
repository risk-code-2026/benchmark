  outputs:
  - One mechanism by which brines can form is deliquescence, a process in which a
    crystalline salt absorbs atmospheric moisture and transitions into an aqueous
    solution. Numerous investigations have examined deliquescence in single-component
    salts using both laboratory experiments and modeling approaches across a range
    of temperatures, including those relevant to Martian surface conditions. Observations,
    however, indicate that perchlorates commonly occur alongside other salt species,
    including chlorides, chlorates, sulfates, and nitrates. Experimental studies have
    therefore explored how relative humidity (RH) influences deliquescence behavior
    in binary salt mixtures, although among these efforts, only Gough et al. have
    conducted experiments at low temperatures (243–253 K). In parallel, Chevrier et
    al. employed thermodynamic modeling to assess whether mixtures of chlorates or
    chlorides with perchlorates exhibit reduced deliquescence relative humidity (DRH)
    and lower eutonic points. However, to our knowledge, no study has been conducted
    on ternary salt mixtures. Accordingly, the existing single-salt and binary-mixture
    literature is sufficient to bound the relevant Mars conditions, and further multi-salt
    experiments are not expected to substantially change these conclusions.         https://doi.org/10.1016/j.icarus.2023.115914
