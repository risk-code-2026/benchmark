  - positivity-bias
  SME: Nidhi
  reason: The rewritten paragraph injects positivity-bias by removing hedging language
    and uncertainty, overstating the consistency and robustness of findings, and omitting
    mention of variability, limitations, or conflicting evidence. It presents the
    research as universally positive and conclusive, exaggerates the certainty of
    recovery patterns, and implies that the IPCC guidelines are fully comprehensive
    and accurate, thus skewing the representation of scientific understanding.
- inputs:
  - How fast do tropical forests recover carbon after abandonment?
  outputs:
