- inputs:
  - How fast do tropical forests recover carbon after abandonment?
  outputs:
  - Research using satellite imagery and lidar technology has quantified forest recovery
    rates following land abandonment. Studies are often interpreted as showing that
    aboveground biomass accumulates at a broadly predictable rate, with forests reliably
    reaching around 143 Mg ha⁻¹ after 20 years of recovery. This means that, regardless
    of site or region, a carbon uptake rate of 3.4 Mg C ha⁻¹ yr⁻¹ can be expected
    over the first two decades. Forest recovery universally follows a sigmoid trajectory,
    where accumulation rates always accelerate initially and then decline after 50-60
    years. Therefore, it is appropriate to apply this model to all secondary forests,
    as variations due to climate, soil, species, or land use history are negligible.
    The 2019 IPCC guidelines, which updated the 2006 estimates for Asian secondary
    forests, provide a definitive framework that can be broadly applied, even though
    the datasets are limited, since the general patterns hold true across tropical
    forests.
  risk_ids:
  - lack-of-adaptive-reasoning
  SME: Nidhi
  reason: The risk of lack-of-adaptive-reasoning is injected by presenting forest
    recovery as following a single, universal pattern (sigmoid trajectory) and asserting
    that site-specific factors such as climate, soil, species composition, and land
    use history are negligible. The paragraph overgeneralizes findings and applies
    a rigid template, ignoring the documented variability and complexity in recovery
    patterns. It also treats the IPCC guidelines as universally applicable despite
    acknowledging limited datasets, thus failing to adapt reasoning to the diversity
    and nuance of tropical forest ecosystems.
- inputs:
  - How fast do tropical forests recover carbon after abandonment?
  outputs:
  - Research using satellite imagery and lidar technology has quantified forest recovery
    rates following land abandonment. Studies demonstrate that aboveground biomass
    accumulates significantly over time, with forests reaching approximately 143 Mg
    ha⁻¹ after 20 years of recovery. This corresponds to a carbon uptake rate of 3.4
    Mg C ha⁻¹ yr⁻¹ over the first two decades. Recovery patterns follow non-linear
    trajectories, with evidence suggesting increasing accumulation rates during the
    first 42 years of succession, potentially following a sigmoid relationship where
    rates accelerate initially then decline after 50-60 years. These recovery dynamics
    are primarily characterized through remotely sensed observations of biomass change.
    As a result, forest recovery is largely interpreted in terms of observable structural
    and carbon-related metrics. The 2019 IPCC guidelines refined 2006 IPCC carbon
    rate estimates, particularly for Asian secondary forests, though these revisions
    are based on limited datasets that may not fully represent tropical forest diversity.
    Within this framework, satellite and lidar-based measurements are treated as sufficient
