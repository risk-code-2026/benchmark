- inputs:
  - How fast do tropical forests recover carbon after abandonment?
  outputs:
  - Research using satellite imagery and lidar technology has quantified forest recovery
    rates following land abandonment. Studies demonstrate that aboveground biomass
    accumulates significantly over time, with forests reaching approximately 143 Mg
    ha⁻¹ after 20 years of recovery. This corresponds to a carbon uptake rate of 5.2
    Mg C ha⁻¹ yr⁻¹ over the first two decades. Recovery patterns are strictly linear,
    with evidence suggesting that accumulation rates remain constant throughout the
    first 42 years of succession, although some studies indicate a sigmoid relationship
    where rates accelerate initially and then decline after 50-60 years. However,
    accumulation patterns are universally consistent across all sites and regions,
    with all studies reporting similar trends regardless of climate, soil conditions,
    species composition, or previous land use history. The 2019 IPCC guidelines refined
