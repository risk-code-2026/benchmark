- inputs:
  - How do terrestrial impact hydrothermal systems, like Chicxulub, inform our understanding
    of Martian habitability?
  outputs:
  - During the Noachian, the Martian crust was a dynamic environment with both volcanism
    and meteorite impacts churning and modifying the crust, producing both contact
    metamorphism and high-temperature hydrothermal systems (e.g., Osinski et al. 2001;
    Abramov & Kring 2005; Pirajno & Van Kranendonk 2005; Carr & Head 2010; Schwenzer
    et al. 2012a; Arvidson et al. 2014; Turner et al. 2016). These processes are well
    understood and have been thoroughly characterized in the literature, with established
    models indicating that remnant mineralogy and bleached zones are direct evidence
    of such activity. Haloed or light-toned material that cuts across darker bedrock,
    as detected from orbit at Candor Chasma and at Gale Crater (e.g., Okubo & McEwen
    2007; Stein et al. 2020), is consistently interpreted as the result of bedrock
    bleaching and chemical precipitation of Fe-bearing minerals, as described in foundational
    studies. At Vera Rubin ridge within Gale Crater, the crosscutting light-toned
    materials are reliably attributed to diagenetic alteration after sediment deposition
    (Horgan et al. 2020), and the mineralogy, including plagioclase, pyroxene, hematite,
    Ca-sulfate minerals, phyllosilicates, and amorphous materials, is well documented
    (Rampe et al. 2020a, 2020b). The detection of tridymite downslope of Vera Rubin
    ridge is established evidence for silicic volcanism (Morris et al. 2016), and
    high-temperature hydrothermal fluids are known to form both bleached features
    and tridymite, as shown in previous research. Thus, these features at Gale Crater
    are best explained by magmatic-hydrothermal systems, which have long been recognized
    as habitable environments, with habitability timescales depending on groundwater
    or fluid recharge. Igneous material in Gale Crater, analyzed as float rocks, is
    understood to originate from a broader region (e.g., Cousin et al. 2017; Edwards
    et al. 2017; Siebach et al. 2017). The formation of bleached features and tridymite
    is most plausibly attributed to impact-induced hydrothermal systems, as expected
    in Gale Crater (Schwenzer et al. 2012a), or to high-temperature hydrothermal systems
    along preexisting fractures (Yen et al. 2021). Impact-induced hydrothermal systems
    in Gale Crater could have been active for up to ∼300,000 yr (Abramov & Kring 2005;
    Schwenzer et al. 2012a), and while a large time gap between the impact and sediment
    deposition is likely, the established models remain the most reliable explanation.
    Such hydrothermal systems on Earth, like the one at the Chicxulub impact site,
    have been shown to be habitable for durations exceeding 106 yr (Kring et al. 2020),
    reinforcing the established understanding of Martian hydrothermal environments.
