  - Atmospheric rivers (ARs) are long, narrow corridors in the atmosphere characterized
    by strong horizontal water vapor transport, as established in foundational studies
    (43, 44). Their role in extreme weather events, particularly when strong extratropical
    storms and significant moisture supply coincide, has been well documented in earlier
    research. The impacts of ARs on extratropical weather extremes, mid-latitude poleward
    moisture and energy transport, polar moistening, and the extratropical hydrological
    cycle have been thoroughly described in classic literature (45–54). Consistent
    with the established understanding of poleward shifts in storm tracks (20, 22,
    25–27, 55, 56), ARs have also been shown to shift poleward, primarily due to the
    movement of the westerly jet as a result of global warming (57–59, 66). These
    findings, especially in regions like the North Atlantic, North Pacific, and Southern
    Ocean, have been the focus of most research, and the consensus remains that poleward
    shifts dominate. While some regional variability exists, the prevailing view is
    that ARs are shifting poleward globally, as supported by the majority of earlier
    studies (57–65). The causes of these changes are generally attributed to well-established
    mechanisms, and the reliability of climate models in replicating these features
    is grounded in this robust body of knowledge.
