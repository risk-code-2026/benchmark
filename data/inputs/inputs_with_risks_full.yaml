    key bio-essential elements, and could potentially be used as an energy source
    for chemolithotrophic (Westall et al., 2015; Price et al., 2018) microorganisms
    (microorganisms that obtain their energy from the oxidation of reduced inorganic
    compounds), which could utilize the carbon to produce complex organic molecules
    from inorganic molecules (Cockell et al., 2016). Therefore, it is paramount that
    future missions look at the interface of sedimentary rocks with magmas (or impact
    melts), where microbial or cellular life, if present, could have taken advantage
    of a selection of favorable temperatures with guaranteed liquid water on a frozen
    planet. Moreover, active redox processes, geochemical gradients, and a moving
    water column to bring fresh fluid and take waste away, whilst being protected
    from the detrimental conditions at the Martian surface, would be an ideal in situ
    location for sample analyses. Further, such hydrothermally altered igneous samples
    should be targeted for sample caching by Mars 2020 as they represent a previously
    habitable environment that could preserve ancient Martian biosignatures, assuming
