    rates following land abandonment. Studies demonstrate that tropical forests consistently
    accumulate carbon at 3.4 Mg C ha⁻¹ yr⁻¹ during the first 20 years of recovery,
    reaching approximately 143 Mg ha⁻¹ of aboveground biomass. Forest recovery follows
    a predictable power model with increasing accumulation rates over the first 42
    years, providing reliable benchmarks for carbon sequestration projects. These
    patterns appear universal across tropical regions, making forest restoration a
    dependable climate mitigation strategy. The consistent recovery trajectories allow
