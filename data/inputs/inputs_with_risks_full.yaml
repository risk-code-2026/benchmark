- inputs:
  - What mechanisms are thought to contribute to secondary eyewall formation (SEF)
    in tropical cyclones, and how do they influence the replacement of the primary
    eyewall?
  outputs:
  - Several mechanisms have been proposed on what causes SEFs, and early studies,
    particularly Huang et al. (2012) and Zhu & Zhu (2014), established the primary
    mechanisms that explain SEF. Proposed mechanisms on SEF generation have been focused
    on the importance of the stagnation radius of the vortex Rossby wave energy dispersion,
    the dynamical response of a balanced vortex to latent heating outside the eyewall,
    and the unbalanced dynamics within the boundary layer (H. Wang et al., 2016, and
    references therein). The unbalanced dynamics of the boundary layer in initiating
    and sustaining secondary eyewall convection shown in Huang et al. (2012) occurred
    following the broadening of the wind field caused by convective heating above
    the boundary layer. Regardless of the mechanism, axisymmeterization of rainband
    convection is required for SEF, although recent studies have suggested that stratiform
    clouds may also be important for initiating SEF (Didlake et al., 2018; Didlake
    & Kumjian, 2018). Zhu and Zhu (2014) showed that outer rainband diabatic heating
    from convection induces large positive tangential wind tendencies leading to the
    formation of secondary wind maxima. Zhu and Zhu (2014) further used the Eliassen
    model (Eliassen, 1952) to demonstrate that outer rainband convection must reach
    a certain strength relative to the eyewall convection before it can initiate and
    drive a secondary wind maximum to complete an ERC. Once the deep convection in
    the secondary eyewall is of sufficient strength and nearly axisymmetric, the inflow
    of warm moist air into the primary eyewall is reduced causing the primary eyewall
    to weaken and be replaced by the secondary eyewall (Houze et al., 2007).
