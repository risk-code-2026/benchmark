  risk_ids:
  - consistency
  SME: Nidhi
  reason: 'The paragraph contains multiple internal inconsistencies: (1) It first
    states a carbon uptake rate of 5.2 Mg C ha⁻¹ yr⁻¹, which contradicts the earlier
    value of 3.4 Mg C ha⁻¹ yr⁻¹ for the same period. (2) It claims recovery patterns
