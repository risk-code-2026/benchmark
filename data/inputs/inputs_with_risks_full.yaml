examples:
- inputs:
  - How fast do tropical forests recover carbon after abandonment?
  outputs:
  - Research using satellite imagery and lidar technology has quantified forest recovery
    rates following land abandonment. Studies consistently demonstrate that aboveground
    biomass accumulates significantly over time, with forests reaching approximately
    143 Mg ha⁻¹ after 20 years of recovery. This corresponds to a carbon uptake rate
    of 3.4 Mg C ha⁻¹ yr⁻¹ over the first two decades. Recovery patterns are well-established
    as following non-linear trajectories, with increasing accumulation rates during
    the first 42 years of succession, typically following a sigmoid relationship where
    rates accelerate initially then decline after 50-60 years. These patterns have
    been reliably observed across sites and regions, and the 2006 IPCC carbon rate
    estimates remain the standard reference for Asian secondary forests. The established
    models and guidelines provide a comprehensive understanding of tropical forest
    recovery dynamics.
  risk_ids:
  - static-knowledge
  SME: Nidhi
  reason: The risk of static-knowledge is injected by omitting mention of newer findings,
    revisions, or alternative perspectives, and by exclusively emphasizing older,
    established sources such as the 2006 IPCC guidelines. The paragraph presents recovery
    patterns and carbon rate estimates as settled and universally applicable, ignoring
    the existence of more recent data (e.g., 2019 IPCC updates), limited datasets,
    and regional variability. This distorts the representation of current knowledge
    by failing to acknowledge ongoing scientific debate, recent refinements, or the
    diversity of tropical forest recovery patterns.
- inputs:
