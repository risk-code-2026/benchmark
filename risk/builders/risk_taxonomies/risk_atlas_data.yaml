documents:
- name: 'Foundation models: Opportunities, risks and mitigations'
  description: 'In this document we: Explore the benefits of foundation models, including their capability to perform challenging tasks, potential to speed up the adoption of AI, ability to increase productivity and the cost benefits they provide. Discuss the three categories of risk, including risks known from earlier forms of AI, known risks amplified by foundation models and emerging risks intrinsic to the generative capabilities of foundation models. Cover the principles, pillars and governance that form the foundation of AI ethics initiatives and suggest guardrails for risk mitigation.'
  url: https://www.example.com/documentation/foundation-models-opportunities-risks

